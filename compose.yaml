# Personal kanban — local / self-hosted.
# By default the port is bound to localhost only. Put it behind your own HTTPS reverse proxy
# (and set COOKIE_SECURE=1, TRUST_PROXY=1) before exposing it anywhere.
name: personal-kanban
services:
  kanban:
    build: .
    image: personal-kanban:local
    restart: unless-stopped
    ports:
      - "${KANBAN_BIND:-127.0.0.1}:${KANBAN_PORT:-8080}:8080"
    environment:
      COOKIE_SECURE: "${COOKIE_SECURE:-0}"
      TRUST_PROXY: "${TRUST_PROXY:-}"
    volumes:
      - kanban-data:/data
volumes:
  kanban-data:
